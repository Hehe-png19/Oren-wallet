<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dompetku">
<title>Dompetku</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /*
   * STONE ISLAND AESTHETIC — Industrial Monochrome
   * Font: Terkunci ke system font terbaik per platform.
   * iOS/macOS  → SF Pro (via -apple-system / BlinkMacSystemFont)
   * Android    → Roboto (via system-ui)
   * Windows    → Segoe UI
   * Tidak ada Google Fonts — font TIDAK akan berubah di platform manapun.
   */
  :root {
    --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text',    'Segoe UI', system-ui, sans-serif;

    /* Stone Island Palette — batu, industri, militer */
    --accent:       #e8552a;   /* SI orange-red */
    --accent-dim:   #c44420;
    --accent-glow:  rgba(232,85,42,0.18);
    --bg:           #0e0e0e;   /* hitam batu */
    --bg2:          #141414;
    --bg3:          #1a1a1a;
    --card:         #181818;
    --border:       #262626;
    --border2:      #303030;
    --text:         #f2f0ed;   /* putih hangat seperti label garment */
    --text2:        #8a8580;
    --text3:        #4a4844;
    --stone:        #c8c2ba;   /* abu batu alami */
    --red:          #d94040;
    --green:        #4caf76;
    --badge:        #2a2a2a;
  }
</style>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { font-size: clamp(13px, 3.8vw, 16px); }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    /* Noise texture overlay untuk tekstur batu */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  input, select, textarea, button { font-family: var(--font-body); font-size: 1rem; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { display: none; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

  #app { height: 100vh; display: flex; flex-direction: column; max-width: 420px; margin: 0 auto; }
  .page { flex: 1; overflow-y: auto; padding-bottom: 88px; }

  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideIn { from{opacity:0;transform:translateX(28px)} to{opacity:1;transform:translateX(0)} }
  @keyframes pop { 0%{transform:scale(0.9)} 60%{transform:scale(1.03)} 100%{transform:scale(1)} }
  @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-12px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes scanline { from{background-position:0 0} to{background-position:0 100%} }

  .fade-up { animation: fadeUp 0.35s cubic-bezier(0.16,1,0.3,1) both; }
  .slide-in { animation: slideIn 0.3s cubic-bezier(0.16,1,0.3,1) both; }

  /* ── TAG / BADGE KECIL ── */
  .si-tag {
    display:inline-block;
    font-size:0.52rem;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text3);
    border:1px solid var(--border2);
    padding:3px 8px;
    border-radius:3px;
    font-family:var(--font-display);
  }

  /* ── BOTTOM NAV — Stone Island style ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 420px;
    background: rgba(14,14,14,0.97);
    backdrop-filter: blur(24px) saturate(0.6);
    -webkit-backdrop-filter: blur(24px) saturate(0.6);
    border-top: 1px solid var(--border);
    display: flex; padding: 10px 0 22px; z-index: 100;
  }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer; padding:0; }
  .nav-icon { font-size:1.15rem; line-height:1; filter:grayscale(0.3); }
  .nav-label {
    font-size:0.52rem;
    font-family:var(--font-display);
    font-weight:700;
    color:var(--text3);
    letter-spacing:1.5px;
    text-transform:uppercase;
  }
  .nav-label.active { color:var(--accent); }
  .nav-add-btn {
    width:2.9rem; height:2.9rem;
    border-radius:4px;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:1.6rem; color:#fff;
    margin-top:-1.1rem;
    box-shadow:0 6px 24px rgba(232,85,42,0.4);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .nav-btn:active .nav-add-btn { transform:scale(0.91); box-shadow:0 2px 10px rgba(232,85,42,0.3); }

  /* ── CARDS ── */
  .card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:6px;
  }

  /* ── WALLET CARD ── */
  .wallet-card {
    border-radius:6px; padding:18px 20px;
    display:flex; align-items:center; gap:14px;
    cursor:pointer; transition:transform 0.12s, opacity 0.12s;
    position:relative; overflow:hidden;
    border-left-width:3px !important;
    border-left-style:solid !important;
  }
  .wallet-card::after {
    content:'';
    position:absolute;
    top:0; right:0;
    width:40%;
    height:100%;
    background:linear-gradient(to left, rgba(255,255,255,0.02), transparent);
    pointer-events:none;
  }
  .wallet-card:active { transform:scale(0.97); opacity:0.8; }
  .wallet-icon-wrap { width:3rem; height:3rem; border-radius:4px; background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0; }
  .wallet-info { flex:1; min-width:0; }
  .wallet-name { font-family:var(--font-display); font-size:0.88rem; font-weight:700; color:var(--text); letter-spacing:0.3px; text-transform:uppercase; }
  .wallet-budget { font-size:0.67rem; opacity:0.6; margin-top:3px; letter-spacing:0.5px; font-family:var(--font-display); }
  .wallet-balance { font-family:var(--font-display); font-size:1rem; font-weight:700; text-align:right; flex-shrink:0; letter-spacing:-0.3px; }
  .wallet-bar { position:absolute; bottom:0; left:0; height:2px; transition:width 0.5s ease; }

  /* ── TX ITEM ── */
  .tx-item { display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer; transition:background 0.1s; }
  .tx-item:active { background:var(--bg3); }
  .tx-icon { width:2.5rem; height:2.5rem; border-radius:4px; background:var(--bg3); display:flex; align-items:center; justify-content:center; font-size:1.05rem; flex-shrink:0; border:1px solid var(--border); }
  .tx-info { flex:1; min-width:0; }
  .tx-name { font-family:var(--font-display); font-size:0.8rem; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:0.2px; text-transform:uppercase; }
  .tx-sub { font-size:0.67rem; color:var(--text3); margin-top:3px; letter-spacing:0.5px; }
  .tx-amount { font-family:var(--font-display); font-weight:700; font-size:0.88rem; flex-shrink:0; letter-spacing:-0.2px; }

  /* ── FORM ── */
  .form-label { font-size:0.6rem; color:var(--text3); letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; font-family:var(--font-display); font-weight:700; }
  .form-input {
    width:100%; background:var(--bg3);
    border:1px solid var(--border2);
    border-radius:4px; padding:13px 14px;
    color:var(--text); font-size:0.88rem;
    outline:none;
    transition:border-color 0.2s, box-shadow 0.2s;
    font-family:var(--font-body);
    letter-spacing:0.2px;
  }
  .form-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(232,85,42,0.12); }
  .form-input::placeholder { color:var(--text3); }

  /* ── PILLS ── */
  .filter-pill {
    padding:6px 14px; border-radius:3px;
    border:1px solid var(--border2);
    background:transparent;
    color:var(--text3);
    font-family:var(--font-display); font-weight:700; font-size:0.58rem;
    cursor:pointer; transition:all 0.12s;
    letter-spacing:1.5px;
    text-transform:uppercase;
  }
  .filter-pill.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* ── TYPE TOGGLE ── */
  .type-toggle { display:flex; background:var(--bg3); border-radius:4px; padding:3px; border:1px solid var(--border2); }
  .type-btn { flex:1; padding:11px; border-radius:3px; border:none; font-family:var(--font-display); font-weight:700; font-size:0.72rem; cursor:pointer; transition:all 0.15s; background:transparent; color:var(--text3); letter-spacing:1px; text-transform:uppercase; }
  .type-btn.active-out { background:var(--red); color:#fff; }
  .type-btn.active-in  { background:var(--green); color:#fff; }

  .big-btn { width:100%; padding:15px; border:none; border-radius:4px; font-family:var(--font-display); font-weight:700; font-size:0.88rem; cursor:pointer; transition:opacity 0.12s, transform 0.1s; letter-spacing:1.5px; text-transform:uppercase; }
  .big-btn:active { opacity:0.82; transform:scale(0.98); }

  .toast {
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    padding:10px 20px; border-radius:3px;
    font-family:var(--font-display); font-weight:700; font-size:0.72rem;
    z-index:999; white-space:nowrap;
    animation:toastIn 0.25s ease;
    box-shadow:0 4px 24px rgba(0,0,0,0.5);
    letter-spacing:1px;
    text-transform:uppercase;
  }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:998; padding:20px; }
  .modal-box { background:#1a1a1a; border:1px solid var(--border2); border-radius:6px; padding:24px; width:100%; max-width:360px; animation:pop 0.2s ease; max-height:80vh; overflow-y:auto; box-shadow:0 32px 80px rgba(0,0,0,0.7); }

  .detail-row { display:flex; justify-content:space-between; padding:12px 14px; background:var(--bg3); border-radius:4px; border:1px solid var(--border); }
  .detail-label { font-size:0.62rem; color:var(--text3); font-family:var(--font-display); font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
  .detail-val { font-size:0.8rem; color:var(--stone); font-weight:600; font-family:var(--font-display); }

  .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .section-title { font-family:var(--font-display); font-size:0.68rem; font-weight:700; color:var(--text3); letter-spacing:2px; text-transform:uppercase; }
  .see-all { font-size:0.6rem; color:var(--accent); font-family:var(--font-display); font-weight:700; background:none; border:none; cursor:pointer; letter-spacing:1.5px; text-transform:uppercase; }

  .empty-state { text-align:center; padding:48px 0; color:var(--text3); font-size:0.75rem; font-family:var(--font-display); letter-spacing:1px; text-transform:uppercase; }
  .empty-icon { font-size:2rem; margin-bottom:12px; filter:grayscale(1) opacity(0.4); }

  .back-btn { background:none; border:none; color:var(--accent); font-family:var(--font-display); font-weight:700; font-size:0.72rem; cursor:pointer; margin-bottom:20px; display:flex; align-items:center; gap:6px; letter-spacing:1px; text-transform:uppercase; }
  .back-btn:active { opacity:0.6; }
  .wallet-sel-item { display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:4px; cursor:pointer; transition:background 0.12s; border:1px solid var(--border); }
  .wallet-sel-item:active { background:var(--bg3); }
  .wallet-sel-item.selected { border-color:var(--accent); background:rgba(232,85,42,0.07); }

  /* ── AUTH ── */
  .auth-page { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; z-index:9999; }
  .auth-logo { font-family:var(--font-display); font-size:2rem; font-weight:800; color:var(--text); margin-bottom:4px; letter-spacing:-0.5px; text-transform:uppercase; }
  .auth-sub { font-size:0.58rem; color:var(--text3); letter-spacing:3px; text-transform:uppercase; margin-bottom:40px; font-family:var(--font-display); }
  .auth-card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--border2); border-radius:6px; padding:28px; }
  .auth-tab { display:flex; background:var(--bg3); border-radius:4px; padding:3px; margin-bottom:22px; border:1px solid var(--border); }
  .auth-tab-btn { flex:1; padding:10px; border-radius:3px; border:none; font-family:var(--font-display); font-weight:700; font-size:0.72rem; cursor:pointer; transition:all 0.15s; background:transparent; color:var(--text3); letter-spacing:1px; text-transform:uppercase; }
  .auth-tab-btn.active { background:var(--accent); color:#fff; }
  .sync-dot { width:6px; height:6px; border-radius:99px; display:inline-block; margin-right:5px; flex-shrink:0; }
  .sync-dot.synced { background:var(--green); }
  .sync-dot.syncing { background:#ffb347; animation: pulse 1s infinite; }
  .sync-dot.offline { background:#444; }
  .sync-dot.error { background:var(--red); }
  .user-bar { display:flex; align-items:center; gap:8px; padding:9px 16px; background:var(--bg2); border-bottom:1px solid var(--border); font-size:0.6rem; color:var(--text3); }
  .user-bar-email { flex:1; color:var(--text2); font-family:var(--font-display); font-weight:700; font-size:0.6rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:0.5px; }
  .logout-btn { background:none; border:1px solid var(--border2); color:var(--text3); font-family:var(--font-display); font-weight:700; font-size:0.58rem; cursor:pointer; padding:4px 10px; border-radius:3px; letter-spacing:1px; text-transform:uppercase; }
</style>
</head>
<body>
<div id="app">
  <!-- Auth Overlay -->
  <div class="auth-page" id="auth-page">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
      <div style="width:36px;height:36px;background:var(--accent);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:1.2rem">🪙</div>
      <div class="auth-logo">DOMPETKU</div>
    </div>
    <div class="auth-sub">Catatan Keuangan Pribadi</div>
    <div class="auth-card">
      <div class="auth-tab">
        <button class="auth-tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Masuk</button>
        <button class="auth-tab-btn" id="tab-register" onclick="switchAuthTab('register')">Daftar</button>
      </div>
      <div id="auth-form-wrap">
        <div style="margin-bottom:16px">
          <div class="form-label">Email</div>
          <input class="form-input" id="auth-email" type="email" placeholder="email@contoh.com" autocomplete="email">
        </div>
        <div style="margin-bottom:22px">
          <div class="form-label">Password</div>
          <input class="form-input" id="auth-password" type="password" placeholder="Min. 6 karakter" autocomplete="current-password">
        </div>
        <button class="big-btn" id="auth-submit-btn" style="background:var(--accent);color:#fff" onclick="doAuth()">Masuk</button>
        <div id="auth-error" style="margin-top:12px;font-size:0.75rem;color:var(--red);text-align:center;display:none"></div>
        <div id="auth-loading" style="margin-top:12px;font-size:0.75rem;color:var(--text2);text-align:center;display:none">⏳ Mohon tunggu...</div>
      </div>
    </div>
    <div style="margin-top:18px;font-size:0.58rem;color:var(--text3);text-align:center;letter-spacing:1px;text-transform:uppercase;font-family:var(--font-display)">Data tersimpan aman di cloud ☁️</div>
  </div>

  <!-- User Bar -->
  <div class="user-bar" id="user-bar" style="display:none">
    <span class="sync-dot offline" id="sync-dot"></span>
    <span class="user-bar-email" id="user-email-label">-</span>
    <button class="logout-btn" onclick="doLogout()">Keluar</button>
  </div>

  <div class="page" id="page-content"></div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>
<div class="toast" id="toast" style="display:none"></div>
<div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)hideModal()">
  <div class="modal-box" id="modal-box"></div>
</div>

<script>
// ─── SUPABASE CONFIG ──────────────────────────────────────────────
// Ganti nilai di bawah ini dengan URL dan anon key dari project Supabase kamu.
// Atau bisa konfigurasi lewat tombol "Konfigurasi" di halaman login.
const SUPABASE_CONFIG_KEY = 'dompetku_supabase_cfg';

function getSupabaseCfg() {
  // Hardcoded config — tidak perlu input manual
  return {
    url: 'https://qerwbklzajwylhwsfgqt.supabase.co',
    key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlcndia2x6YWp3eWxod3NmZ3F0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MDgxOTYsImV4cCI6MjA5NTE4NDE5Nn0.xeNRGjrMDhvSF2pWTUEZf-bdgaz0ex8BbVm-ikA-39M'
  };
}
function setSupabaseCfg(url, key) {
  localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify({ url, key }));
}

let sb = null; // Supabase client instance

function initSupabase() {
  const cfg = getSupabaseCfg();
  if (cfg.url && cfg.key) {
    try {
      sb = window.supabase.createClient(cfg.url, cfg.key);
      return true;
    } catch(e) { console.warn('Supabase init failed', e); return false; }
  }
  return false;
}

// ─── AUTH STATE ───────────────────────────────────────────────────
let authUser = null;
let syncStatus = 'offline'; // offline | syncing | synced | error
let authTab = 'login';

function setSyncStatus(s) {
  syncStatus = s;
  const dot = document.getElementById('sync-dot');
  if (!dot) return;
  dot.className = 'sync-dot ' + s;
  dot.title = s === 'synced' ? 'Tersinkron' : s === 'syncing' ? 'Menyinkron...' : s === 'error' ? 'Gagal sync' : 'Offline';
}

function switchAuthTab(tab) {
  authTab = tab;
  document.getElementById('tab-login').className = 'auth-tab-btn' + (tab==='login'?' active':'');
  document.getElementById('tab-register').className = 'auth-tab-btn' + (tab==='register'?' active':'');
  document.getElementById('auth-submit-btn').textContent = tab==='login' ? 'Masuk' : 'Daftar';
  document.getElementById('auth-error').style.display = 'none';
}

function showSupabaseConfig() {
  const cfg = getSupabaseCfg();
  showModal(`
    <div style="font-family:var(--font-display);font-size:0.9rem;font-weight:700;color:var(--text);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px">Konfigurasi Supabase</div>
    <div style="font-size:0.68rem;color:var(--text3);margin-bottom:18px">Dapatkan URL & Key dari dashboard.supabase.com → Project Settings → API</div>
    <div style="margin-bottom:14px">
      <div class="form-label">Project URL</div>
      <input class="form-input" id="sb-url" type="url" placeholder="https://xxxx.supabase.co" value="${cfg.url||''}">
    </div>
    <div style="margin-bottom:20px">
      <div class="form-label">Anon Public Key</div>
      <input class="form-input" id="sb-key" type="text" placeholder="eyJ..." value="${cfg.key||''}">
    </div>
    <div style="display:flex;gap:10px">
      <button onclick="hideModal()" style="flex:1;padding:12px;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;color:var(--text2);font-family:var(--font-display);font-weight:700;font-size:0.7rem;cursor:pointer;letter-spacing:1px;text-transform:uppercase">Batal</button>
      <button onclick="saveSupabaseCfg()" style="flex:1;padding:12px;background:var(--accent);border:none;border-radius:4px;color:#fff;font-family:var(--font-display);font-weight:700;font-size:0.7rem;cursor:pointer;letter-spacing:1px;text-transform:uppercase">Simpan</button>
    </div>
  `);
}

function saveSupabaseCfg() {
  const url = document.getElementById('sb-url').value.trim();
  const key = document.getElementById('sb-key').value.trim();
  if (!url || !key) return showToast('Isi URL dan Key!','#d94040','#fff');
  setSupabaseCfg(url, key);
  hideModal();
  initSupabase();
  showToast('Konfigurasi disimpan ✓');
}

async function doAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const pw    = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  const loadEl= document.getElementById('auth-loading');
  errEl.style.display = 'none';

  if (!email || !pw) { errEl.textContent='Isi email dan password!'; errEl.style.display='block'; return; }
  if (!sb) {
    if (!initSupabase()) {
      errEl.textContent='Konfigurasi Supabase belum diatur. Klik "Konfigurasi" di bawah.';
      errEl.style.display='block'; return;
    }
  }

  loadEl.style.display='block';
  document.getElementById('auth-submit-btn').disabled=true;

  try {
    let result;
    if (authTab === 'login') {
      result = await sb.auth.signInWithPassword({ email, password: pw });
    } else {
      result = await sb.auth.signUp({ email, password: pw });
    }
    if (result.error) throw result.error;
    // session handled via onAuthStateChange
  } catch(e) {
    errEl.textContent = e.message || 'Gagal autentikasi';
    errEl.style.display = 'block';
  } finally {
    loadEl.style.display='none';
    document.getElementById('auth-submit-btn').disabled=false;
  }
}

async function doLogout() {
  if (sb) await sb.auth.signOut();
  authUser = null;
  document.getElementById('auth-page').style.display='flex';
  document.getElementById('user-bar').style.display='none';
  setSyncStatus('offline');
}

// ─── SUPABASE SYNC ────────────────────────────────────────────────
async function syncToSupabase() {
  if (!sb || !authUser) return;
  setSyncStatus('syncing');
  try {
    const payload = {
      user_id: authUser.id,
      txs: state.txs,
      wallets: state.wallets,
      updated_at: new Date().toISOString(),
    };
    const { error } = await sb.from('dompetku_data').upsert(payload, { onConflict: 'user_id' });
    if (error) throw error;
    setSyncStatus('synced');
  } catch(e) {
    console.warn('Sync error', e);
    setSyncStatus('error');
    showToast('Sync gagal: '+e.message,'#d94040','#fff');
  }
}

async function loadFromSupabase() {
  if (!sb || !authUser) return false;
  setSyncStatus('syncing');
  try {
    const { data, error } = await sb.from('dompetku_data').select('*').eq('user_id', authUser.id).single();
    if (error && error.code !== 'PGRST116') throw error; // PGRST116 = not found (first time)
    if (data) {
      state.txs     = data.txs     || [];
      state.wallets = data.wallets && data.wallets.length ? data.wallets : JSON.parse(JSON.stringify(DEFAULT_WALLETS));
      // juga update localStorage sebagai cache offline
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.txs)); } catch{}
      try { localStorage.setItem(WALLET_KEY,  JSON.stringify(state.wallets)); } catch{}
    }
    setSyncStatus('synced');
    return true;
  } catch(e) {
    console.warn('Load from Supabase error', e);
    setSyncStatus('error');
    return false;
  }
}

function onUserLoggedIn(user) {
  authUser = user;
  document.getElementById('auth-page').style.display='none';
  document.getElementById('user-bar').style.display='flex';
  document.getElementById('user-email-label').textContent = user.email;
  setSyncStatus('syncing');

  // Load data dari Supabase dulu, baru render
  loadFromSupabase().then(() => render());
}

// ─── INIT AUTH ────────────────────────────────────────────────────
function initAuth() {
  if (!initSupabase()) {
    // Tidak ada config Supabase — tetap tampilkan auth page
    return;
  }

  // Listen auth state changes
  sb.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      onUserLoggedIn(session.user);
    } else if (event === 'SIGNED_OUT') {
      authUser = null;
      document.getElementById('auth-page').style.display='flex';
      document.getElementById('user-bar').style.display='none';
    }
  });

  // Cek session aktif
  sb.auth.getSession().then(({ data }) => {
    if (data.session && data.session.user) {
      onUserLoggedIn(data.session.user);
    }
  });
}

initAuth();
</script>

function today() { return new Date().toISOString().slice(0,10); }
function formatRp(n) { return 'Rp'+Number(n).toLocaleString('id-ID'); }
function getWeekStart(d) { const dt=new Date(d); dt.setDate(dt.getDate()-dt.getDay()+1); return dt.toISOString().slice(0,10); }

function walletById(id) { return state.wallets.find(w=>w.id===id); }

// ─── WALLET BALANCE ───────────────────────────────────────────────
function walletTxs(walletId, filter) {
  const now = new Date();
  const thisWeek = getWeekStart(now.toISOString().slice(0,10));
  const thisMonth = now.toISOString().slice(0,7);
  return state.txs.filter(t => {
    if(t.walletId !== walletId) return false;
    if(filter==='minggu') return getWeekStart(t.date)===thisWeek;
    if(filter==='bulan') return t.date.slice(0,7)===thisMonth;
    return true;
  });
}
function walletBalance(walletId, filter) {
  return walletTxs(walletId, filter).reduce((s,t)=> t.type==='in' ? s+t.amount : s-t.amount, 0);
}
function walletSpent(walletId, filter) {
  return walletTxs(walletId, filter).filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
}

// ─── GLOBAL TOTALS ────────────────────────────────────────────────
function globalTotals(filter) {
  const now=new Date();
  const thisWeek=getWeekStart(now.toISOString().slice(0,10));
  const thisMonth=now.toISOString().slice(0,7);
  const txs = state.txs.filter(t=>{
    if(filter==='minggu') return getWeekStart(t.date)===thisWeek;
    if(filter==='bulan') return t.date.slice(0,7)===thisMonth;
    return true;
  });
  const totalIn  = txs.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
  const totalOut = txs.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
  return { totalIn, totalOut, saldo: totalIn-totalOut };
}

  const dataUri = 'data:text/plain;charset=utf-8,' + encodeURIComponent('DOMPETKU_BACKUP\n' + json);
  const a = document.createElement('a');
  a.href = dataUri;
  a.download = `dompetku-backup-${date}.txt`;

function importData(){

  input.onchange = e => {

    const reader = new FileReader();
    reader.onload = ev => {
      try {
        let text = ev.target.result.trim();
        // Support both .txt (dengan header) dan .json lama
        if(text.startsWith('DOMPETKU_BACKUP')) {
          text = text.replace('DOMPETKU_BACKUP', '').trim();

        const data = JSON.parse(text);
        if(!data.txs || !data.wallets) throw new Error('Format tidak valid');

}

// ─── HISTORY ─────────────────────────────────────────────────────
function renderHistory(){
  const now=new Date();
  const thisWeek=getWeekStart(now.toISOString().slice(0,10));
  const thisMonth=now.toISOString().slice(0,7);
  const txs=state.txs.filter(t=>{
    if(state.filter==='minggu') return getWeekStart(t.date)===thisWeek;
    if(state.filter==='bulan') return t.date.slice(0,7)===thisMonth;
    return true;
  });

  const txHTML=txs.length===0
    ? `<div class="empty-state"><div class="empty-icon">📭</div>Belum ada transaksi</div>`
    : txs.map((tx,i)=>{
        const w=walletById(tx.walletId);
        return `<div class="tx-item card fade-up" style="margin-bottom:8px;animation-delay:${Math.min(i,12)*0.03}s" onclick="openTxDetail(${tx.id})">
          <div class="tx-icon" style="background:${w?w.color+'22':'#1e1e28'}">${w?w.icon:'📌'}</div>
          <div class="tx-info">
            <div class="tx-name">${w?w.name:'?'}</div>
            <div class="tx-sub">${tx.date}${tx.note?' · '+tx.note:''}</div>
          </div>
          <div class="tx-amount" style="color:${tx.type==='in'?'var(--green)':'var(--red)'}">${tx.type==='in'?'+':'-'}${formatRp(tx.amount)}</div>
        </div>`;
      }).join('');

  document.getElementById('page-content').innerHTML=`
    <div style="padding:28px 16px 12px" class="fade-up">
      <div style="font-size:0.55rem;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-bottom:6px;font-family:var(--font-display);font-weight:700">Riwayat</div>

      ${['semua','minggu','bulan'].map(f=>`<button class="filter-pill ${state.filter===f?'active':''}" onclick="setFilter('${f}')">${f==='semua'?'Semua':f==='minggu'?'Minggu Ini':'Bulan Ini'}</button>`).join('')}

    <div style="padding:0 16px">${txHTML}</div>
  `;
}

  const w=walletById(state.editingWallet);
  w.name=state.wForm.name.trim(); w.icon=state.wForm.icon; w.color=state.wForm.color; w.budget=parseInt(state.wForm.budget)||0;

        amount: Math.abs(diff),

        date: today()
      });

  }

  showToast('Dompet berhasil diupdate ✓');
}

// ─── CALCULATOR ───────────────────────────────────────────────────
function calcInput(val){
  const c = state.calc;
  if(val==='C'){ state.calc={ display:'0', expr:'', prev:0, op:'', fresh:true }; }
  else if(val==='⌫'){
    if(c.display.length>1) c.display=c.display.slice(0,-1);
    else c.display='0';
  }
  else if(val==='%'){
    c.display = String(parseFloat(c.display)/100);
  }
  else if(['+','-','×','÷'].includes(val)){
    c.prev = parseFloat(c.display);
    c.op = val; c.fresh = true;
    c.expr = c.display + ' ' + val;
  }
  else if(val==='='){
    if(!c.op) return;
    const a=c.prev, b=parseFloat(c.display);
    let res;
    if(c.op==='+') res=a+b;
    else if(c.op==='-') res=a-b;
    else if(c.op==='×') res=a*b;
    else if(c.op==='÷') res=b!==0?a/b:0;
    c.display = String(parseFloat(res.toFixed(10)));
    c.expr=''; c.op=''; c.fresh=true;
  }
  else if(val==='.'){
    if(c.fresh){ c.display='0.'; c.fresh=false; }
    else if(!c.display.includes('.')) c.display+='.';
  }
  else {
    if(c.fresh||c.display==='0'){ c.display=val; c.fresh=false; }
    else c.display+=val;
  }
  // Update display only — no full re-render to avoid flicker
  updateCalcDisplay();
}

function updateCalcDisplay(){
  const c = state.calc;
  const fmt = n => {
    const num = parseFloat(n);
    if(isNaN(num)) return n;
    return num.toLocaleString('id-ID', {maximumFractionDigits:8});
  };
  const exprEl = document.getElementById('calc-expr');
  const dispEl = document.getElementById('calc-display');
  const rpEl   = document.getElementById('calc-rp');
  if(exprEl) exprEl.textContent = c.expr||'';
  if(dispEl) dispEl.textContent = fmt(c.display);
  if(rpEl)   rpEl.textContent   = 'Rp '+(parseFloat(c.display)||0).toLocaleString('id-ID');
}

function calcUseAsAmount(){
  const val = state.calc.display;
  const num = parseFloat(val);
  if(!isNaN(num) && num>0){
    state.form.amount = String(Math.round(num));
    go('add');
    showToast('Nominal diisi dari kalkulator ✓');
  }
}

function renderCalc(){
  const c = state.calc;
  const fmt = n => {
    const num = parseFloat(n);
    if(isNaN(num)) return n;
    return num.toLocaleString('id-ID', {maximumFractionDigits:8});
  };

  const btns = [
    ['C','%','⌫','÷'],
    ['7','8','9','×'],
    ['4','5','6','-'],
    ['1','2','3','+'],
    ['0','.',  '=','='],
  ];

  const btnStyle = (b) => {
    const isOp=['+','-','×','÷'].includes(b);
    const isEq=b==='=';
    const isFn=['C','%','⌫'].includes(b);
    // B&W palette: operators = dark gray, eq = white, fn = medium gray, num = slightly lighter gray
    const bg = isEq?'#ffffff':isOp?'#2e2e2e':isFn?'#242424':'#1c1c1c';
    const color = isEq?'#000000':isOp?'#ffffff':isFn?'#cccccc':'#ffffff';
    const border = isEq?'none':isOp?'1px solid #444':'1px solid #333';
    return `background:${bg};color:${color};border:${border}`;
  };

  let rowsHTML = '';
  for(let r=0;r<btns.length;r++){
    const row=btns[r];
    let cells='';
    let skip=false;
    for(let ci=0;ci<row.length;ci++){
      if(skip){skip=false;continue;}
      const b=row[ci];
      const isDouble=r===4&&ci===0;
      const isDoubleEq=r===4&&ci===2;
      const baseStyle=`border:none;border-radius:10px;font-family:var(--font-display);font-weight:700;font-size:1.3rem;cursor:pointer;padding:18px 0;touch-action:manipulation;user-select:none;-webkit-user-select:none;`;
      if(isDouble){
        cells+=`<button onclick="calcInput('${b}')" style="flex:2;${btnStyle(b)};${baseStyle}">${b}</button>`;
      } else if(isDoubleEq){
        cells+=`<button onclick="calcInput('=')" style="flex:2;${btnStyle('=')};${baseStyle};font-weight:800;font-size:1.5rem">=</button>`;
        skip=true;
      } else {
        cells+=`<button onclick="calcInput('${b}')" style="flex:1;${btnStyle(b)};${baseStyle}">${b}</button>`;
      }
    }
    rowsHTML+=`<div style="display:flex;gap:8px">${cells}</div>`;
  }

  document.getElementById('page-content').innerHTML=`
    <div style="padding:20px 16px 0" class="fade-up">
      <div style="font-size:0.55rem;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-bottom:4px">Tools</div>
      <div style="font-family:var(--font-display);font-size:1.4rem;font-weight:800;color:var(--text);margin-bottom:16px;letter-spacing:-0.3px">KALKULATOR</div>

      <!-- Display — hitam putih, tidak re-render saat tombol ditekan -->
      <div style="background:#0a0a0a;border:1px solid #2a2a2a;border-radius:10px;padding:18px 20px 14px;margin-bottom:12px">
        <div id="calc-expr" style="font-size:0.72rem;color:#555;min-height:18px;text-align:right;font-family:var(--font-display);letter-spacing:0.5px">${c.expr||''}</div>
        <div id="calc-display" style="font-family:var(--font-display);font-size:2.4rem;font-weight:800;color:#ffffff;text-align:right;margin-top:2px;word-break:break-all;line-height:1.1">${fmt(c.display)}</div>
        <div id="calc-rp" style="font-size:0.65rem;color:#444;text-align:right;margin-top:4px;letter-spacing:0.5px">Rp ${(parseFloat(c.display)||0).toLocaleString('id-ID')}</div>
      </div>

      <!-- Tombol — no ontouchstart/ontouchend to prevent flicker -->
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
        ${rowsHTML}
      </div>

      <!-- Use as amount -->
      <button onclick="calcUseAsAmount()" style="width:100%;padding:13px;background:transparent;border:1px solid #444;border-radius:8px;color:#ccc;font-family:var(--font-display);font-weight:700;font-size:0.72rem;cursor:pointer;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px">
        ↗ Gunakan sebagai nominal transaksi
      </button>
    </div>
  `;
}

// ─── KURS KONVERTER ───────────────────────────────────────────────
const CURRENCIES = [
  { code:'USD', name:'Dolar AS',        flag:'🇺🇸' },
  { code:'EUR', name:'Euro',            flag:'🇪🇺' },
  { code:'SGD', name:'Dolar Singapura', flag:'🇸🇬' },
  { code:'MYR', name:'Ringgit Malaysia',flag:'🇲🇾' },
  { code:'JPY', name:'Yen Jepang',      flag:'🇯🇵' },
  { code:'GBP', name:'Poundsterling',   flag:'🇬🇧' },
  { code:'AUD', name:'Dolar Australia', flag:'🇦🇺' },
  { code:'CNY', name:'Yuan China',      flag:'🇨🇳' },
  { code:'KRW', name:'Won Korea',       flag:'🇰🇷' },
  { code:'SAR', name:'Riyal Saudi',     flag:'🇸🇦' },
  { code:'AED', name:'Dirham UAE',      flag:'🇦🇪' },
  { code:'THB', name:'Baht Thailand',   flag:'🇹🇭' },
];

let kursState = {
  amount: '',
  from: 'IDR',
  to: 'USD',
  rates: null,
  loading: false,
  error: null,
  lastFetch: null,
};

async function fetchKurs(){
  if(kursState.rates && kursState.lastFetch && (Date.now()-kursState.lastFetch < 300000)) {
    renderKurs(); return;
  }
  kursState.loading = true; kursState.error = null;
  renderKurs();
  try {
    // Gunakan API gratis tanpa key
    const res = await fetch('https://api.exchangerate-api.com/v4/latest/IDR');
    if(!res.ok) throw new Error('Gagal ambil data kurs');
    const data = await res.json();
    kursState.rates = data.rates;
    kursState.lastFetch = Date.now();
    kursState.loading = false;
    renderKurs();
  } catch(e) {
    // Fallback rates jika API gagal
    kursState.rates = { USD:0.000062, EUR:0.000057, SGD:0.000083, MYR:0.00029, JPY:0.0092, GBP:0.000049, AUD:0.000096, CNY:0.00045, KRW:0.083, SAR:0.00023, AED:0.00023, THB:0.0022, IDR:1 };
    kursState.loading = false;
    kursState.error = 'Offline — menggunakan kurs estimasi';
    renderKurs();
  }
}

  const ks = kursState;
  const amt = parseFloat(ks.amount)||0;
  let result = '';
  if(ks.rates && amt>0){
    // IDR ke mata uang lain
    const rateTarget = ks.rates[ks.to]||1;
    const converted = amt * rateTarget;
    const toCurr = CURRENCIES.find(c=>c.code===ks.to)||{flag:'',name:ks.to};

        <div style="font-family:var(--font-display);font-size:2rem;font-weight:800;color:#fff;letter-spacing:-0.5px">${toCurr.flag} ${converted.toLocaleString('id-ID',{maximumFractionDigits:4})}</div>
        <div style="font-size:0.72rem;color:#888;margin-top:4px;font-family:var(--font-display)">${ks.to} · ${toCurr.name}</div>
        <div style="font-size:0.62rem;color:#444;margin-top:8px">1 IDR = ${rateTarget.toLocaleString('id-ID',{maximumFractionDigits:8})} ${ks.to}</div>
        <div style="font-size:0.62rem;color:#444;margin-top:2px">1 ${ks.to} = ${(1/rateTarget).toLocaleString('id-ID',{maximumFractionDigits:2})} IDR</div>
      </div>`;
  }

  const currOpts = CURRENCIES.map(c=>`<option value="${c.code}" ${ks.to===c.code?'selected':''}>${c.flag} ${c.code} — ${c.name}</option>`).join('');

  document.getElementById('page-content').innerHTML=`
    <div style="padding:20px 16px 0" class="fade-up">
      <div style="font-size:0.55rem;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-bottom:4px">Tools</div>
      <div style="font-family:var(--font-display);font-size:1.4rem;font-weight:800;color:var(--text);margin-bottom:16px;letter-spacing:-0.3px">KONVERSI KURS</div>

      <div style="background:#111;border:1px solid #222;border-radius:10px;padding:18px;margin-bottom:12px">
        <div style="font-size:0.6rem;color:#555;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;font-family:var(--font-display)">Nominal (Rupiah)</div>
        <div style="position:relative;margin-bottom:16px">
          <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#666;font-family:var(--font-display);font-weight:700;font-size:0.9rem">Rp</span>
          <input class="form-input" type="number" inputmode="numeric" placeholder="0"
            style="padding-left:44px;font-family:var(--font-display);font-size:1.2rem;font-weight:700;background:#0a0a0a;border-color:#2a2a2a"
            value="${ks.amount}" oninput="kursState.amount=this.value;renderKurs()">
        </div>
        <div style="font-size:0.6rem;color:#555;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;font-family:var(--font-display)">Ke Mata Uang</div>
        <select class="form-input" style="background:#0a0a0a;border-color:#2a2a2a;color:#fff;font-family:var(--font-display)"
          onchange="kursState.to=this.value;renderKurs()">
          ${currOpts}
        </select>
      </div>

      ${ks.loading ? `<div style="text-align:center;padding:20px;color:#555;font-family:var(--font-display);font-size:0.8rem;letter-spacing:1px">⏳ Mengambil kurs terkini...</div>` : ''}
      ${ks.error ? `<div style="font-size:0.7rem;color:#666;text-align:center;margin-bottom:10px;font-family:var(--font-display)">${ks.error}</div>` : ''}
      ${result}

      <!-- Semua Kurs -->

            const rate = ks.rates[c.code]||0;
            const rev = rate>0?(1/rate).toLocaleString('id-ID',{maximumFractionDigits:2}):'-';
            return `<div style="display:flex;align-items:center;padding:11px 14px;background:#0f0f0f;border:1px solid #1e1e1e;border-radius:8px;cursor:pointer${ks.to===c.code?';border-color:#444':''}" onclick="kursState.to='${c.code}';renderKurs()">

              <div style="flex:1">
                <div style="font-family:var(--font-display);font-size:0.78rem;font-weight:700;color:#ddd">${c.code}</div>
                <div style="font-size:0.62rem;color:#555;margin-top:2px">${c.name}</div>
              </div>
              <div style="text-align:right">
                <div style="font-family:var(--font-display);font-size:0.78rem;font-weight:700;color:#fff">${rate.toLocaleString('id-ID',{maximumFractionDigits:6})}</div>
                <div style="font-size:0.6rem;color:#555;margin-top:2px">1 ${c.code} = Rp${rev}</div>
              </div>
            </div>`;
          }).join('')}
        </div>
        <div style="font-size:0.58rem;color:#333;text-align:center;margin-bottom:16px;font-family:var(--font-display)">${ks.lastFetch?'Update: '+new Date(ks.lastFetch).toLocaleTimeString('id-ID'):''}</div>
      ` : ''}
    </div>
  `;
}

        </div>
      </div>

      <div style="margin-bottom:16px">
        <div class="form-label">Ke Dompet</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${wallets.filter(w=>w.id!==ts.from).map(w=>{
            const bal = walletBalance(w.id,'semua');
            const sel = ts.to===w.id;
            return `<div onclick="transferState.to='${w.id}';renderTransfer()"
              style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;border:1.5px solid ${sel?'#fff':'#222'};background:${sel?'#1a1a1a':'#0f0f0f'};cursor:pointer">
              <div style="font-size:1.3rem">${w.icon}</div>
              <div style="flex:1">
                <div style="font-family:var(--font-display);font-size:0.8rem;font-weight:700;color:#fff;text-transform:uppercase">${w.name}</div>
                <div style="font-size:0.65rem;color:#666;margin-top:2px">${formatRp(bal)}</div>
              </div>
              ${sel?`<div style="color:#fff;font-size:1rem">✓</div>`:''}
            </div>`;
          }).join('')}
        </div>
      </div>

      <div style="margin-bottom:14px">
        <div class="form-label">Nominal Transfer</div>
        <div style="position:relative">
          <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#666;font-family:var(--font-display);font-weight:700;font-size:0.9rem">Rp</span>
          <input class="form-input" type="number" inputmode="numeric" placeholder="0"
            style="padding-left:44px;font-family:var(--font-display);font-size:1.1rem;font-weight:700"
            value="${ts.amount}" oninput="transferState.amount=this.value">
        </div>
      </div>

      <div style="margin-bottom:20px">
        <div class="form-label">Catatan (opsional)</div>
        <input class="form-input" type="text" placeholder="Contoh: bagi biaya makan..."
          value="${ts.note}" oninput="transferState.note=this.value">
      </div>

      <button onclick="doTransfer()" class="big-btn" style="background:#ffffff;color:#000000">
        ↔ Lakukan Transfer
      </button>
    </div>
  `;
}

function doTransfer(){
  const ts = transferState;
  const amt = parseInt((ts.amount+'').replace(/\D/g,''));
  if(!ts.from) return showToast('Pilih dompet asal!','#d94040','#fff');
  if(!ts.to)   return showToast('Pilih dompet tujuan!','#d94040','#fff');
  if(!amt||amt<=0) return showToast('Nominal tidak valid!','#d94040','#fff');
  const fromW = walletById(ts.from);
  const toW   = walletById(ts.to);
  const bal   = walletBalance(ts.from,'semua');
  if(amt>bal) return showToast('Saldo tidak cukup!','#d94040','#fff');
  const now = Date.now();
  const note = ts.note.trim()||`Transfer ke ${toW.name}`;
  state.txs.unshift({ id:now,   type:'out', walletId:ts.from, amount:amt, note:note, date:today() });
  state.txs.unshift({ id:now+1, type:'in',  walletId:ts.to,   amount:amt, note:`Transfer dari ${fromW.name}`, date:today() });
  save();
  transferState = { from:'', to:'', amount:'', note:'' };
  showToast(`Transfer ${formatRp(amt)} berhasil ✓`);
  go('home');
}

// ─── PWA ─────────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ─── INIT ────────────────────────────────────────────────────────
// load dari localStorage sebagai data sementara/offline
load();
// Render hanya jika tidak ada config Supabase (mode offline)
const _sbCfg = getSupabaseCfg();
if (!_sbCfg.url || !_sbCfg.key) {
  // Mode offline — langsung tampilkan app tanpa login
  document.getElementById('auth-page').style.display = 'none';
  document.getElementById('user-bar').style.display = 'none';
  render();
}
// Jika ada config Supabase, onAuthStateChange di initAuth() yang handle render
</script>
